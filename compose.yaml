# Credenciales y bind se leen de `.env` (Compose lo carga solo desde este
# directorio). Este archivo esta versionado en un repo publico: no poner
# secretos aca.
#
# Ojo: POSTGRES_PASSWORD solo se aplica cuando se INICIALIZA el volumen. Para
# cambiar la password de una base ya creada hay que hacer
# `ALTER USER ... WITH PASSWORD ...` y actualizar `.env`.
services:
  postgres:
    image: postgres:16
    container_name: db_noticias_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:?falta DATABASE_NAME en .env}
      POSTGRES_USER: ${DATABASE_USER:?falta DATABASE_USER en .env}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?falta DATABASE_PASSWORD en .env}
    ports:
      # DB_BIND controla quien alcanza Postgres. Por defecto solo localhost;
      # en este servidor esta puesto en la IP de Tailscale para poder conectar
      # desde otros equipos de la tailnet.
      - "${DB_BIND:-127.0.0.1}:${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data_noticias:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_noticias:
